<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GigMat Society Dashboard - Manage local gig workers, bookings, payments and welfare for your district cooperative." />
    <title>GigMat — Society Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Unregister any stale service workers (e.g. from old SlotSense project) -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var reg of registrations) {
            reg.unregister();
            console.log('[GigMat] Unregistered old service worker:', reg.scope);
          }
        });
        // Also clear all caches left by old service workers
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var name of names) {
              caches.delete(name);
              console.log('[GigMat] Cleared old cache:', name);
            }
          });
        }
      }
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
