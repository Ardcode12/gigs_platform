[alembic]
script_location = alembic
prepend_sys_path = .
# Timestamped revision filenames, so migrations sort chronologically on disk.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# Left empty on purpose: alembic/env.py takes the URL from .env via app.core.config,
# so the Supabase password never sits in a tracked file.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
